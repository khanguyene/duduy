<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giới Thiệu Bản Thân</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
       .thett {
            background-color: #fffbfb;
           width: 800px;
             border-radius: 10px;
             display: flex;
             flex-direction: column;
             border: 3px solid black;
             transform: scale(1.4);         
             transform-origin: top center; 
             margin-bottom: 80px;           
}

        .noidung {
            display: flex;
            padding: 30px;
            gap: 30px;
            align-items: center; 
        }
        .avt img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin-top: 25px;
            border-radius: 22px;
        }
        .logo img {
            width: 150px;       
            height: 150px;
            object-fit: contain;
            margin-top: 80px;
        }
        .khungtt {
            flex: 1;
        }
        h1 {
            font-size: 25px;
            color: #0e0d0d;
            margin-bottom: 5px;
            display: flex;
        }

        .thongtin {
            width: 100%;
            border-collapse: collapse;
        }

        .thongtin tr td {
            padding: 6px 0;
            font-size: 14px;
        }

        .thongtin tr td:first-child {
            color: #333;
            width: 90px;
        }
        .thongtin tr td:last-child {
            color: #666;
        }
        .lienhe {
            background-color: #e53935;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            gap: 45px;
        }

        .lienhe a {
            color: white;
            font-size: 16px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .lienhe a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="thett">
        <div class="noidung">
            <div class="avt">
                <a href="#"><img src="https://i.ibb.co/kFWcpN6/meme-meo-9.jpg" alt="meme meo 9" border="0"></a>
            </div>
            <div class="khungtt">
                <h1>GIỚI THIỆU BẢN THÂN</h1>
                <hr style="border: none; border-top: 1px solid #655656a8; margin: 15px 0;">

                <table class="thongtin">
                    <tr>
                        <td>Tên</td>
                        <td>Trần Dũ Duy</td>
                    </tr>
                    <tr>
                        <td>Ngày Sinh</td>
                        <td>26/09/2007</td>
                    </tr>
                    <tr>
                        <td>Địa chỉ</td>
                        <td>Bình Thủy, Cần Thơ</td>
                    </tr>
                    <tr>
                        <td>Học tại</td>
                        <td><a href="https://www.ctec.edu.vn/ctec/" target="_blank">CTEC</a></td>
                    </tr>
                </table>
            </div>
            <div class="logo">
                <a href="#"><img src="https://i.ibb.co/rRLzTyjD/FB-IMG-1791638830212.jpg" alt="FB IMG 1791638830212" border="0"></a>
            </div>
        </div>
        
        <div class="lienhe">
            <a href="https://www.facebook.com/share/1J4Ktfbbjo/"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/tr_dzuy?rpxt=ajJhd3BvM28xc3N2" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="mailto:tdduy25ctha0022@ctec.edu.vn" target="_blank"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
</body>
</html>
